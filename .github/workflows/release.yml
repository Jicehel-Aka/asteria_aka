name: Release

# Publie une release quand tu pousses un tag de version, ex :
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de version a publier (ex: v0.1.0). Laisser vide = builds seuls, sans release."
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # --------- Firmware console AKA (ESP32-S3) ---------
  aka:
    name: Firmware AKA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nettoyer un build/ périmé (CMakeCache avec chemin local)
        run: rm -rf build sdkconfig.old
      - name: Build ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.3
          target: esp32s3
          path: '.'
      - name: Préparer le paquet AKA
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Paquet pret a l'emploi :
          #   carte_SD/  -> a copier tel quel a la racine de la carte SD (dossier ASTERIA
          #                 avec le firmware.bin FRAIS de ce build + tous les assets)
          #   flash/     -> binaires pour un flash direct (idf.py / esptool), optionnel
          mkdir -p dist/carte_SD dist/flash
          cp -r sdcard_files/. dist/carte_SD/
          rm -f dist/carte_SD/ASTERIA/SAVE*.DAT                 # jamais de sauvegarde de test dans un paquet
          cp build/asteria_aka.bin dist/carte_SD/ASTERIA/firmware.bin
          cp build/asteria_aka.bin dist/flash/firmware.bin
          [ -f build/bootloader/bootloader.bin ]           && cp build/bootloader/bootloader.bin dist/flash/ || true
          [ -f build/partition_table/partition-table.bin ] && cp build/partition_table/partition-table.bin dist/flash/ || true
          [ -f build/flash_args ]                          && cp build/flash_args dist/flash/ || true
          # Version/date du launcher AKA = tag de la release
          if [ -n "$TAG" ] && [ "$TAG" != "main" ]; then
            V="${TAG#v}"; D=$(date -u +%Y-%m-%d)
            sed -i -E "s/(\"version\": *\")[^\"]*/\1$V/; s/(\"date\": *\")[^\"]*/\1$D/" dist/carte_SD/ASTERIA/meta.json
          fi
          cat > dist/LISEZMOI.txt <<'TXT'
          ASTERIA - console Gamebuino AKA
          1. Copier le CONTENU du dossier carte_SD a la racine de la carte SD
             (remplacer le dossier ASTERIA existant ; les sauvegardes SAVE1..3.DAT
             deja presentes sur la carte ne sont pas dans ce paquet et sont conservees
             si on fusionne au lieu de supprimer le dossier).
          2. Lancer ASTERIA depuis le menu de la console.
          Le dossier flash/ ne sert que pour un flash direct par cable (esptool/idf.py).
          TXT
          sed -i 's/^          //' dist/LISEZMOI.txt
          cat dist/carte_SD/ASTERIA/meta.json
          find dist -maxdepth 3 | sort
      - uses: actions/upload-artifact@v4
        with:
          name: aka-firmware
          path: dist/*
          if-no-files-found: error

  # --------- Exécutable Windows (SDL2, MSYS2/MinGW) ---------
  windows:
    name: PC Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: 'msys2 {0}'
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
      - name: Compiler
        run: |
          A=components/asteria
          g++ -std=c++17 -O2 -I "$A" \
            $A/asteria_app.cpp $A/ui/text.cpp $A/player.cpp $A/gamestate.cpp \
            $A/i18n.cpp $A/content_i18n.cpp $A/save.cpp $A/autotile.cpp $A/audio/jingle.cpp $A/audio/music.cpp $A/daytime.cpp $A/progress.cpp $A/scene/*.cpp \
            gb_port_sdl.cpp main_sdl.cpp pmf_pc.cpp components/gamebuino/gb_lib/pmf_player/pmf_player.cpp -I components/gamebuino/gb_lib/pmf_player -I components/gamebuino/include_lib -I components/gamebuino/include_ll $(sdl2-config --cflags --libs) \
            -o asteria_pc.exe
          mkdir -p dist
          cp asteria_pc.exe dist/
          # DLL runtime necessaires a l'execution sur une machine sans MSYS2
          cp /mingw64/bin/SDL2.dll dist/
          cp /mingw64/bin/libstdc++-6.dll dist/
          cp /mingw64/bin/libgcc_s_seh-1.dll dist/
          cp /mingw64/bin/libwinpthread-1.dll dist/
          # Assets (ecran-titre + fonds de combat). Le jeu tourne sans, mais c'est plus joli avec.
          [ -d sdcard_files ] && cp -r sdcard_files dist/ || true
          # La version PC n'a besoin que des assets : ni firmware console, ni sauvegarde de test
          rm -f dist/sdcard_files/ASTERIA/firmware.bin dist/sdcard_files/ASTERIA/SAVE*.DAT
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: asteria-windows
          path: dist/*
          if-no-files-found: error

  # --------- Exécutable Linux (SDL2) ---------
  linux:
    name: PC Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Compiler
        run: |
          A=components/asteria
          g++ -std=c++17 -O2 -I "$A" \
            $A/asteria_app.cpp $A/ui/text.cpp $A/player.cpp $A/gamestate.cpp \
            $A/i18n.cpp $A/content_i18n.cpp $A/save.cpp $A/autotile.cpp $A/audio/jingle.cpp $A/audio/music.cpp $A/daytime.cpp $A/progress.cpp $A/scene/*.cpp \
            gb_port_sdl.cpp main_sdl.cpp pmf_pc.cpp components/gamebuino/gb_lib/pmf_player/pmf_player.cpp -I components/gamebuino/gb_lib/pmf_player -I components/gamebuino/include_lib -I components/gamebuino/include_ll $(sdl2-config --cflags --libs) \
            -o asteria_pc
          mkdir -p dist
          cp asteria_pc dist/
          # Assets a cote du binaire (le jeu les cherche dans ./sdcard_files).
          [ -d sdcard_files ] && cp -r sdcard_files dist/ || true
          # La version PC n'a besoin que des assets : ni firmware console, ni sauvegarde de test
          rm -f dist/sdcard_files/ASTERIA/firmware.bin dist/sdcard_files/ASTERIA/SAVE*.DAT
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: asteria-linux
          path: dist/*
          if-no-files-found: error

  # --------- Assemble et publie la release ---------
  release:
    name: Publier la release
    needs: [aka, windows, linux]
    # Publie sur un push de tag, OU sur un "Run workflow" manuel ou un champ 'tag' est renseigne.
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Empaqueter
        run: |
          mkdir -p release
          if [ -d artifacts/aka-firmware ];     then (cd artifacts/aka-firmware     && zip -qr ../../release/ASTERIA_AKA.zip .); fi
          if [ -d artifacts/asteria-windows ];  then (cd artifacts/asteria-windows  && zip -qr ../../release/ASTERIA_Windows.zip .); fi
          if [ -d artifacts/asteria-linux ];    then (cd artifacts/asteria-linux    && zip -qr ../../release/ASTERIA_Linux.zip .); fi
          ls -la release
      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          # Tag du push, ou tag saisi lors du "Run workflow" manuel (cree au SHA courant).
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
