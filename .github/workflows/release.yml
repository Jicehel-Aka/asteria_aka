name: Release

# Publie une release quand tu pousses un tag de version, ex :
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --------- Firmware console AKA (ESP32-S3) ---------
  aka:
    name: Firmware AKA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nettoyer un build/ périmé (CMakeCache avec chemin local)
        run: rm -rf build sdkconfig.old
      - name: Build ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.3
          target: esp32s3
          path: '.'
      - name: Préparer le paquet AKA
        run: |
          mkdir -p dist
          cp build/asteria_aka.bin dist/firmware.bin
          [ -f build/bootloader/bootloader.bin ]     && cp build/bootloader/bootloader.bin dist/ || true
          [ -f build/partition_table/partition-table.bin ] && cp build/partition_table/partition-table.bin dist/ || true
          [ -f build/flash_args ] && cp build/flash_args dist/ || true
          # Assets carte SD s'ils existent dans le dépôt
          for f in meta.json Picture.png screen.bmp; do [ -f "$f" ] && cp "$f" dist/; done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: aka-firmware
          path: dist/*
          if-no-files-found: error

  # --------- Exécutable Windows (SDL2, MSYS2/MinGW) ---------
  windows:
    name: PC Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: 'msys2 {0}'
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
      - name: Compiler
        run: |
          A=components/asteria
          g++ -std=c++17 -O2 -I "$A" \
            $A/asteria_app.cpp $A/ui/text.cpp $A/player.cpp $A/gamestate.cpp \
            $A/i18n.cpp $A/autotile.cpp $A/scene/*.cpp \
            gb_port_sdl.cpp main_sdl.cpp $(sdl2-config --cflags --libs) \
            -o asteria_pc.exe
          mkdir -p dist
          cp asteria_pc.exe dist/
          cp /mingw64/bin/SDL2.dll dist/
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: asteria-windows
          path: dist/*
          if-no-files-found: error

  # --------- Exécutable Linux (SDL2) ---------
  linux:
    name: PC Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Compiler
        run: |
          A=components/asteria
          g++ -std=c++17 -O2 -I "$A" \
            $A/asteria_app.cpp $A/ui/text.cpp $A/player.cpp $A/gamestate.cpp \
            $A/i18n.cpp $A/autotile.cpp $A/scene/*.cpp \
            gb_port_sdl.cpp main_sdl.cpp $(sdl2-config --cflags --libs) \
            -o asteria_pc
          mkdir -p dist
          cp asteria_pc dist/asteria_pc_linux
      - uses: actions/upload-artifact@v4
        with:
          name: asteria-linux
          path: dist/*
          if-no-files-found: error

  # --------- Assemble et publie la release ---------
  release:
    name: Publier la release
    needs: [aka, windows, linux]
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Empaqueter
        run: |
          mkdir -p release
          if [ -d artifacts/aka-firmware ];     then (cd artifacts/aka-firmware     && zip -qr ../../release/ASTERIA_AKA_firmware.zip .); fi
          if [ -d artifacts/asteria-windows ];  then (cd artifacts/asteria-windows  && zip -qr ../../release/ASTERIA_Windows.zip .); fi
          if [ -d artifacts/asteria-linux ];    then cp artifacts/asteria-linux/asteria_pc_linux release/ 2>/dev/null || true; fi
          ls -la release
      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
